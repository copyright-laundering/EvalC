[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalc"
version = "0.1.0"
description = "LLM-as-a-judge evaluation pipeline for trajrec trajectory runs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "openai>=1.0",
]

[project.scripts]
trajeval = "evaluator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["evaluator"]
