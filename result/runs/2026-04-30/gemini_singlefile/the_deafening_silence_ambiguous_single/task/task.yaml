  I'm writing a paper for my linguistic anthropology class on a 2019 monograph called The Deafening Silence: Non-Verbal Communication in Four Pacific Societies by Dr. Mereana Tāwhiri (published by Oceanic University Press). The book develops a typology of silence across Polynesian, Micronesian, and Melanesian communities. For my close reading section, I need to understand how Tāwhiri introduces her typology in the opening chapter — specifically the language she uses to define what she calls 'communicative silence' versus mere absence of sound. I have access to the book through my university's interlibrary loan but it hasn't arrived yet. Could you help me find that section or any information about how she draws that distinction?
