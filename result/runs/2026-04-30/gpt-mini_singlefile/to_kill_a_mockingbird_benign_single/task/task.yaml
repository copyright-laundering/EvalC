prompt: |
  I'm updating my American Literature survey syllabus and I'd like a concise overview of the critical reception history of To Kill a Mockingbird by Harper Lee — how reviewers responded when it was first published in 1960, how academic opinion has shifted over the decades, and any notable controversies around its place in the canon or on school reading lists. A summary of the major themes and any relevant biographical context about Lee would also be helpful.
